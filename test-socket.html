<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Socket Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  </head>
  <body style="font-family: sans-serif; padding: 20px">
    <h2>📡 Socket.io Tester</h2>
    <div id="status" style="padding: 10px; background: #eee">Connecting...</div>
    <ul id="messages"></ul>

    <script>
      // Connect to your local backend
      const socket = io("http://localhost:5000");

      socket.on("connect", () => {
        document.getElementById("status").style.background = "#d4edda"; // Green
        document.getElementById("status").innerText =
          "✅ Connected with ID: " + socket.id;
      });

      // Listen for the 'new_report' event
      socket.on("new_report", (data) => {
        console.log("Alert Received:", data);
        const li = document.createElement("li");
        li.innerText = `🚨 ALERT: ${data.message} - ${data.report.type}`;
        li.style.color = "red";
        document.getElementById("messages").appendChild(li);
      });

      socket.on("disconnect", () => {
        document.getElementById("status").style.background = "#f8d7da"; // Red
        document.getElementById("status").innerText = "❌ Disconnected";
      });
    </script>
  </body>
</html>
